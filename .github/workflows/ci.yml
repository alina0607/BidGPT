name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Build the DGL backend on the compat layer (it ships for Windows)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build-dglc -DCMAKE_BUILD_TYPE=Release -DSA_BACKEND_DGL_COMPAT=ON
          cmake --build build-dglc --config Release --target sell_anything
      - name: Smoke test (headless backend)
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: End-to-end (the game plays a round against the ML server, headless)
        run: |
          pip install -e ml
          python scripts/e2e_autoplay.py

  ml:
    name: ML service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.15"
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock no longer matches pyproject.toml. On Linux the lock
      # holds the CPU build of torch, so no CUDA libraries are downloaded.
      - name: Install
        run: uv sync --locked --extra train

      - name: Lint
        run: uv run ruff check . ../scripts

      # Only the files listed in [tool.mypy] files (pyproject.toml) are checked.
      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
